[settings]
locked = true

[tools]
rust = "1.97.0"

[tasks.build]
description = "Build the optimized native executable"
tools = { rust = "1.97.0" }
run = "cargo build --release"
run_windows = "cmd.exe /d /c scripts\\build-windows.cmd"

[tasks.install]
description = "Build and install the custom leaf executable"
depends = ["build"]
run = 'mkdir -p "$HOME/.local/bin" && install -m 755 target/release/leaf "$HOME/.local/bin/leaf"'
run_windows = 'cmd.exe /d /c copy /Y "target\release\leaf.exe" "%LOCALAPPDATA%\Programs\leaf\leaf.exe"'
